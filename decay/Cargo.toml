[workspace]
members = [
    "crates/decay-syntax",
    "crates/decay-semantic",
    "crates/decay-ir",
    "crates/decay-runtime",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vardirhq/sindri2"
# Decay is pre-alpha and its crates refer to each other by path. crates.io does
# not accept path dependencies, so a crate declaring itself publishable while
# depending on a sibling by path is claiming something that cannot happen --
# which is exactly what `cargo deny` refuses, and it is right to.
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
