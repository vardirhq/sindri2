[workspace]
members = [
    "editor",
    "crates/sindri",
    "crates/sindri-assets",
    "crates/sindri-core",
    "crates/sindri-decay",
    "crates/sindri-desktop",
    "crates/sindri-export",
    "crates/sindri-gpu",
    "crates/sindri-grid",
    "crates/sindri-physics",
    "crates/sindri-platform",
    "crates/sindri-render",
    "crates/sindri-scene",
    "crates/sindri-weave",
    "tools/decay-lsp",
    "tools/sindri-capabilities",
    "examples/triangle",
    "examples/cube",
    "game",
    "games/orbital-last-stand",
    "games/orbital-baked",
    "games/weave-poc",
]
# Decay and Weave are their own workspaces, and a path dependency alone does not
# keep them that way: cargo makes path dependencies of a member into members too,
# which would silently give their crates this workspace's package/lint settings.
# Excluding them is what actually holds the language boundaries.
exclude = ["decay", "weave"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vardirhq/sindri2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.33", features = ["bytemuck"] }
thiserror = "2"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4"
pollster = "1.0"
web-time = "1"
wgpu = "30"
winit = "0.30.13"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "persistence", "wayland", "wgpu", "x11"] }
fontdb = { version = "0.23", default-features = false, features = ["std"] }
# Not used by anything here, and held back on purpose.
#
# `tinyvec` arrives underneath glyphon (cosmic-text -> fontdb -> tinyvec), and
# 1.13.0 does not compile: it calls `vec!` in a module that imports
# `alloc::vec` as a module rather than the macro, so the build fails inside the
# crate itself. This workspace does not commit a lockfile — see the note beside
# `wildcards` in deny.toml — so every CI run resolves fresh and picked the
# broken release the day it was published, on this branch and on main alike.
#
# `~1.12` takes patch releases and refuses the minor, which is the narrowest
# thing that holds. Drop this the moment a fixed 1.13 exists; the only reason a
# crate nothing calls is listed at all is that a version requirement has to be
# attached to a real dependency to reach the resolver.
tinyvec = "~1.13"
glyphon = "0.12"
js-sys = "0.3"
sha2 = "0.11"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
rapier2d = "0.35.2"
rapier3d = "0.35.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# A game engine's tests are mostly simulation: stepping a world sixty times a
# second and asking what happened. Unoptimised, that arithmetic dominated the
# workspace's test time -- one Orbital test spent a hundred and ten seconds
# simulating six thousand frames, and the two slowest suites together were most
# of CI's critical path. Optimising dependencies takes the suite from about 288
# seconds to 97, because most of that arithmetic is in the physics solver and
# the physics solver is a dependency.
#
# Dependencies rather than the whole workspace, which is the part worth
# explaining. Optimising the workspace too is faster to run -- 97 seconds down
# to 30 -- and still the wrong trade for CI, because the two costs are not paid
# at the same rate. A dependency is compiled once and restored from the cache on
# every run after that; a workspace crate is recompiled on every run, because
# changing one is what a pull request is. Measured cold, optimising the
# workspace cost about 123 seconds of compilation to save about 67 seconds of
# test time, and only the compilation recurs.
#
# So this is deliberately the smaller of the two speedups. A developer who runs
# the suite repeatedly against an unchanged tree is in the opposite position --
# the compilation is paid once and the saving is per run -- and can add
# `[profile.test] opt-level = 2` locally, which is the whole of the difference.
#
# Debug assertions and overflow checks are untouched, so this buys speed rather
# than trading away what the tests are able to catch.
[profile.dev.package."*"]
opt-level = 2
