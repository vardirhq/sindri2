[workspace]
members = [
    "editor",
    "crates/sindri",
    "crates/sindri-assets",
    "crates/sindri-core",
    "crates/sindri-desktop",
    "crates/sindri-gpu",
    "crates/sindri-platform",
    "crates/sindri-render",
    "crates/sindri-scene",
    "examples/triangle",
    "examples/cube",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vardirhq/sindri2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.33", features = ["bytemuck"] }
thiserror = "2"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4"
pollster = "1.0"
web-time = "1"
wgpu = "30"
winit = "0.30.13"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "persistence", "wayland", "wgpu", "x11"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"


[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
