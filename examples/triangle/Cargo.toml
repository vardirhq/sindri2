[package]
name = "sindri-triangle"
description = "Shared native and browser triangle proof for Sindri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
log.workspace = true
sindri-desktop = { path = "../../crates/sindri-desktop" }
sindri-render = { path = "../../crates/sindri-render" }
wgpu.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1"
wasm-bindgen.workspace = true

[lints]
workspace = true
