[package]
name = "sindri-cube"
description = "Shared native and browser depth-tested cube proof for Sindri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glam.workspace = true
log = "0.4"
serde.workspace = true
serde_json.workspace = true
sindri-core = { path = "../../crates/sindri-core" }
sindri-gpu = { path = "../../crates/sindri-gpu" }
sindri-desktop = { path = "../../crates/sindri-desktop" }
sindri-platform = { path = "../../crates/sindri-platform" }
sindri-render = { path = "../../crates/sindri-render" }
sindri-scene = { path = "../../crates/sindri-scene" }
thiserror.workspace = true
web-time = "1"
wgpu.workspace = true
winit = "0.30.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
png = "=0.17.16"
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "HtmlCanvasElement", "Window"] }

[lints]
workspace = true
