[package]
name = "sindri-decay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not publishable, because it depends on the Decay crates and those are not.
# Every other engine crate is publishable and declares its path dependencies
# with a version to say so; this one would be claiming a release it cannot make.
publish = false

[dependencies]
sindri-core = { path = "../sindri-core" }
sindri-grid = { path = "../sindri-grid" }
sindri-physics = { path = "../sindri-physics" }
# Without the audio backend: Decay reads the input state and the key names and
# emits typed playback *intent*, which the host drains — it never talks to a
# device. Taking the default would put a sound card in the dependency tree of
# everything that runs a script, `sindri-export` included, which is a build
# that needs ALSA installed to read some JSON. A host that plays the intent
# depends on `sindri-platform` itself and turns it back on.
sindri-platform = { path = "../sindri-platform", default-features = false }
sindri-scene = { path = "../sindri-scene" }
decay-ir = { path = "../../decay/crates/decay-ir" }
decay-runtime = { path = "../../decay/crates/decay-runtime" }
decay-semantic = { path = "../../decay/crates/decay-semantic" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
