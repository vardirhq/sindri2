<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Everything below resolves against this, which is what lets one build be
       served from a domain root or from a GitHub Pages project subpath without
       a single path in the page changing. -->
  <base href="{{base}}">
  <title>{{name}}</title>
  <style>
    html, body { margin: 0; height: 100%; background: #12161f; color: #f2f5fb; }
    /* The canvas keeps the game's own aspect and sits in the middle, rather
       than stretching, because a game stretched to a window is a game whose
       author's framing was thrown away. */
    body { display: grid; place-items: center; font-family: system-ui, sans-serif; }
    /* The canvas is the page. The host sizes its surface to the window and
       follows it, so this only has to stop the browser adding a scrollbar and
       letting the element keep an intrinsic size it was born with. */
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    #sindri-error {
      display: none;
      box-sizing: border-box;
      max-width: 42rem;
      margin: 2rem;
      padding: 1.25rem 1.5rem;
      border: 1px solid #505b72;
      border-radius: .75rem;
      background: #1b2230;
      line-height: 1.5;
    }
    #sindri-error[data-visible="true"] { display: block; }
    #sindri-error strong { display: block; margin-bottom: .35rem; }
    /* Which build this is. Small and in a corner, because a player does not
       need it and anyone reporting a fault does: "it still does not work" and
       "it still does not work in build a1b2c3d" are different reports, and only
       the second one can be acted on. */
    #sindri-build {
      position: fixed;
      right: .5rem;
      bottom: .35rem;
      font: 11px/1 ui-monospace, monospace;
      color: #7c88a1;
      user-select: text;
      pointer-events: auto;
    }
    /* What the page itself sees the finger do, for a device that cannot be
       attached to a debugger. Off unless asked for by ?input-debug. */
    #sindri-input {
      display: none;
      position: fixed;
      left: 0;
      top: 0;
      max-height: 45vh;
      overflow-y: auto;
      margin: 0;
      padding: .5rem .6rem;
      font: 11px/1.35 ui-monospace, monospace;
      color: #d8e2f5;
      background: #0b0f17e8;
      white-space: pre-wrap;
    }
    #sindri-input[data-visible="true"] { display: block; }
  </style>
</head>
<body>
  <canvas id="sindri-canvas"></canvas>
  <div id="sindri-error" role="alert" aria-live="assertive"></div>
  <pre id="sindri-input"></pre>
  <div id="sindri-build">{{build}}</div>
  <script type="module">
    // The host is versioned in its URL, and the wasm it loads is named
    // explicitly so the query reaches that too. Without this the one file
    // holding the game's code is the one file a returning device may serve from
    // its cache: the assets are content-addressed and always fresh, so a stale
    // host runs new content and every symptom looks like a live bug in code
    // that was already fixed.
    import init from "./pkg/{{host}}.js{{cachebust}}";

    const canvas = document.querySelector("#sindri-canvas");
    const errorBox = document.querySelector("#sindri-error");
    const fail = (title, detail) => {
      canvas?.remove();
      errorBox.dataset.visible = "true";
      errorBox.innerHTML = `<strong>${title}</strong>${detail}`;
    };

    // Startup does not finish when `init()` resolves: winit hands the loop to
    // the page and returns, so an adapter, device, surface, or asset failure
    // happens afterwards with nobody to return it to. The engine announces
    // those on `window`, and this is what turns them into something a player
    // can read instead of a blank canvas and a console line nobody opens.
    addEventListener("sindri:failed", (event) => {
      const detail = String(event.detail ?? "The engine reported a failure.");
      // The whole thing goes to the console for whoever is debugging. A wgpu
      // error carries the JavaScript error it wrapped, stack and all, and a
      // player handed a wasm backtrace has been told nothing — so the page
      // shows the first line, which is the part written for a human.
      console.error(detail);
      const summary = detail.split("\n")[0].trim();
      fail("{{name}} stopped", summary.length > 200 ? `${summary.slice(0, 200)}…` : summary);
    });

    // What the page sees, before winit or wasm is involved. Three fixes deep
    // into "a tap does nothing on a phone", the unanswered question was whether
    // the browser delivers touch to this canvas at all -- and that is a
    // question the page can answer on the device, with no debugger attached.
    if (new URLSearchParams(location.search).has("input-debug")) {
      const log = document.querySelector("#sindri-input");
      log.dataset.visible = "true";
      const seen = new Map();
      const lines = [];
      const show = (text) => {
        lines.push(text);
        if (lines.length > 14) lines.shift();
        log.textContent = `${[...seen].map(([k, n]) => `${k}:${n}`).join("  ")}\n${lines.join("\n")}`;
      };
      show(`build {{build}}`);
      show(`touch-points ${navigator.maxTouchPoints ?? "?"}  ua-mobile ${navigator.userAgentData?.mobile ?? "?"}`);
      for (const kind of ["touchstart", "touchmove", "touchend", "touchcancel",
                          "pointerdown", "pointermove", "pointerup", "pointercancel",
                          "mousedown", "mouseup", "click"]) {
        // On the canvas, capturing, and passive: this reports what arrives and
        // changes nothing about it, so turning the trace on cannot be what
        // makes the input behave differently.
        canvas?.addEventListener(kind, (event) => {
          seen.set(kind, (seen.get(kind) ?? 0) + 1);
          const at = event.touches?.[0] ?? event;
          const where = at.clientX === undefined ? "" :
            ` @${Math.round(at.clientX)},${Math.round(at.clientY)}`;
          const type = event.pointerType ? ` ${event.pointerType}` : "";
          show(`${kind}${type}${where}`);
        }, { capture: true, passive: true });
      }
    }

    const WEBGPU_MISSING =
      "{{name}} requires a browser and device with WebGPU enabled. Update your browser or check its graphics/WebGPU settings.";

    if (!(canvas instanceof HTMLCanvasElement)) {
      fail("{{name}} could not start", "The page is missing the #sindri-canvas canvas Sindri was configured to use.");
    } else if (!navigator.gpu) {
      fail("WebGPU is unavailable", WEBGPU_MISSING);
    } else if (!(await navigator.gpu.requestAdapter().catch(() => null))) {
      // `navigator.gpu` existing is not the same as WebGPU working. Chrome on
      // Android exposes the interface more widely than its drivers can serve,
      // so asking for an actual adapter is the difference between telling a
      // player their device cannot run this and showing them nothing at all.
      fail("WebGPU is unavailable", WEBGPU_MISSING);
    } else {
      try {
        await init({ module_or_path: "./pkg/{{host}}_bg.wasm{{cachebust}}" });
      } catch (error) {
        console.error(error);
        fail("{{name}} could not start", String(error?.message ?? error));
      }
    }
  </script>
</body>
</html>
