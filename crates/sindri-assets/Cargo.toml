[package]
name = "sindri-assets"
description = "Cross-platform asset source abstractions for Sindri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
futures.workspace = true
image.workspace = true
serde_json.workspace = true
sindri-core = { path = "../sindri-core", version = "0.1.0" }
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Headers", "Response", "Window"] }

[dev-dependencies]
pollster = "1.0"
tempfile = "3"

# The decode compatibility tests run on both targets: `#[test]` natively and
# `#[wasm_bindgen_test]` in Node, so a texture that decodes here and not in the
# browser build is a failing test rather than a picture somebody notices.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true
