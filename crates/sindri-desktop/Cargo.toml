[package]
name = "sindri-desktop"
description = "winit window, event loop, and input adapter for the Sindri platform boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
log.workspace = true
sindri-gpu = { path = "../sindri-gpu", version = "0.1.0" }
sindri-platform = { path = "../sindri-platform", version = "0.1.0" }
thiserror.workspace = true
web-time.workspace = true
wgpu.workspace = true
winit.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["CustomEvent", "CustomEventInit", "Document", "HtmlCanvasElement", "Window"] }

[lints]
workspace = true
