[package]
name = "sindri-platform"
description = "Platform boundary traits and the shared host loop for Sindri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Playing a sound needs a sound card, and on Linux that means linking ALSA.
# Everything that plays audio wants this and has it on by default; what does
# not want it is anything that only reads the *rest* of this crate — the input
# state, the key names — and would otherwise need libasound2-dev on the machine
# to build a tool that never makes a noise.
default = ["audio"]
audio = ["dep:rodio"]

[dependencies]
sindri-core = { path = "../sindri-core", version = "0.1.0" }
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# WAV and Vorbis stay on permissive alternate decoders. MP3 uses Symphonia:
# Rodio's minimp3 alternative pulls slice-ring-buffer 0.3.4, which has
# RUSTSEC-2025-0044 (safe-API double frees) and no fixed release. The resulting
# MPL-2.0 exception is scoped to Symphonia's MP3 dependency tree in deny.toml.
rodio = { version = "0.22.2", optional = true, default-features = false, features = ["playback", "symphonia-mp3", "lewton", "hound"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
log.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["Blob", "BlobPropertyBag", "HtmlAudioElement", "HtmlMediaElement", "MediaError", "Storage", "Url", "Window"] }

[lints]
workspace = true
