[package]
name = "sindri-editor"
description = "Native visual authoring environment for Sindri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe.workspace = true
egui_material_icons = { version = "0.8", default-features = false, features = ["outline"] }
glam.workspace = true
sindri-core = { path = "../crates/sindri-core" }
sindri-cube = { path = "../examples/cube" }
sindri-render = { path = "../crates/sindri-render" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"

[lints]
workspace = true
