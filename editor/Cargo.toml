[package]
name = "sindri-editor"
description = "Native visual authoring environment for Sindri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe.workspace = true
egui_material_icons = { version = "0.8", default-features = false, features = ["outline"] }
glam.workspace = true
wgpu.workspace = true
sindri-assets = { path = "../crates/sindri-assets" }
sindri-core = { path = "../crates/sindri-core" }
sindri-decay = { path = "../crates/sindri-decay" }
sindri-platform = { path = "../crates/sindri-platform" }
sindri-render = { path = "../crates/sindri-render" }
sindri-scene = { path = "../crates/sindri-scene" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The demo scene, used only to give the tests a real world to work in. The
# editor itself no longer depends on an example to draw or to load a texture.
sindri-cube = { path = "../examples/cube" }
tempfile = "3"

[lints]
workspace = true
