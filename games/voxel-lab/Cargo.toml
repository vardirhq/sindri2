[package]
name = "voxel-lab"
description = "Acceptance lab for Sindri's engine-owned voxel world and persistent section cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# No game code, in the way Graphics Lab is not a game: this is a proving ground
# for one question — whether a volume can be a shape rather than a picture of
# one — and what lives here is the blocks to look at and the binary that
# photographs them from four sides.
[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
sindri-assets = { path = "../../crates/sindri-assets" }
sindri-core = { path = "../../crates/sindri-core" }
sindri-desktop = { path = "../../crates/sindri-desktop" }
sindri-gpu = { path = "../../crates/sindri-gpu" }
sindri-platform = { path = "../../crates/sindri-platform" }
sindri-render = { path = "../../crates/sindri-render" }
sindri-scene = { path = "../../crates/sindri-scene" }
sindri-voxel = { path = "../../crates/sindri-voxel" }
glam.workspace = true
sindri-grid = { path = "../../crates/sindri-grid" }
png = "0.18"
pollster.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wgpu.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1"
log.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["Document", "Element", "Window"] }

[[bin]]
name = "voxel-lab-capture"
path = "src/bin/capture.rs"

[[bin]]
name = "voxel-lab-scene"
path = "src/bin/scene.rs"

[lints]
workspace = true
