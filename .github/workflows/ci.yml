name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Before anything is compiled, because it needs nothing compiled and a
      # file past the cap is the cheapest failure this job can report.
      - name: Check file sizes
        run: scripts/check-file-size.py
      # Everything the rest of the job needs from the system, installed before
      # clippy rather than before the tests. Clippy compiles the native
      # dependency graph, so ALSA — which Rodio's CPAL backend links on Linux —
      # has to be here already; and SINDRI_REQUIRE_GPU makes a missing adapter
      # fail the GPU tests rather than skip them on the one machine installed to
      # run them.
      #
      # The image does not name a mirror in its sources at all: it points them
      # at a mirrorlist, and Azure's mirror is the first entry in it. When that
      # mirror stops answering — 502 for an hour, then nothing — every index
      # request is ignored, apt sits on the retries, and a step that takes
      # fifteen seconds is still going when something kills it. Dropping that
      # one entry leaves the public archive, which answered in about a second
      # throughout, and costs the few seconds a mirror outside the datacentre
      # does.
      #
      # The rest is about failing rather than hanging. apt waits on the dpkg
      # lock forever by default and on a stalled download for a long time; the
      # timeouts give up instead, and the step timeout turns whatever is left
      # into a failure someone can read in two lines rather than a job nobody
      # can tell apart from a slow one.
      - name: Install native build and software Vulkan dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        timeout-minutes: 5
        run: |
          mirrors=/etc/apt/apt-mirrors.txt
          if [ -f "$mirrors" ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' "$mirrors"
            # Never leave apt with no mirror at all, whatever the list held.
            if ! grep -q . "$mirrors"; then
              echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee "$mirrors" > /dev/null
            fi
          fi
          # An image that names the host directly rather than through a list.
          for list in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$list" ]; then
              sudo sed -i 's|://azure.archive.ubuntu.com/|://archive.ubuntu.com/|g' "$list"
            fi
          done
          # What apt was actually asked for, so the next mirror failure names
          # itself instead of being inferred from what is missing.
          cat "$mirrors" 2>/dev/null || true
          grep -rhE '^(deb |URIs:)' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null || true
          apt_get() {
            sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 "$@"
          }
          apt_get update
          apt_get install --yes imagemagick libasound2-dev libvulkan1 libxkbcommon-x11-0 mesa-vulkan-drivers xdotool xvfb
      - run: cargo clippy --workspace --all-targets --all-features
      - name: Test
        env:
          WGPU_BACKEND: vulkan
          SINDRI_REQUIRE_GPU: 1
        run: cargo test --workspace --all-features
      - name: Capture native editor runtime viewport
        env:
          WGPU_BACKEND: vulkan
        run: timeout 60s xvfb-run --auto-servernum --server-args="-screen 0 1600x1200x24" ./scripts/capture-editor.sh target/render-artifacts/editor-runtime-viewport.png
      - name: Capture scene-driven frame pipeline
        env:
          WGPU_BACKEND: vulkan
        run: cargo run --package sindri-cube --bin capture -- target/render-artifacts/scene-frame-pipeline.png
      - name: Capture the companion game mid-run
        env:
          WGPU_BACKEND: vulkan
        run: cargo run --package sindri-gather --bin gather-capture -- target/render-artifacts/gather.png
      # Both images render the same scene, so both are held to the same colours.
      # The editor screenshot went unexamined for a release while its viewport
      # sampled through a view that decoded a second time: everything else
      # passed and only the picture was wrong.
      - name: Verify captured colours
        run: |
          cargo run --package sindri-cube --bin verify -- target/render-artifacts/editor-runtime-viewport.png
          cargo run --package sindri-cube --bin verify -- target/render-artifacts/scene-frame-pipeline.png
      - name: Upload visual test captures
        uses: actions/upload-artifact@v7
        with:
          name: visual-test-captures
          path: |
            target/render-artifacts/editor-runtime-viewport.png
            target/render-artifacts/scene-frame-pipeline.png
            target/render-artifacts/gather.png
          if-no-files-found: error
          retention-days: 14
      - name: Check browser workspace
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --workspace --all-features --target wasm32-unknown-unknown
      # A texture that decodes natively and not in the browser build is the
      # failure the asset system's whole promise rests on, so the decode corpus
      # is run on the browser target too, in Node through wasm-bindgen's runner.
      # The version has to match the wasm-bindgen the workspace resolves.
      - name: Test image decoding in the browser build
        run: |
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
          cargo test --package sindri-assets --target wasm32-unknown-unknown \
            --test decode_compatibility
      # Compiling for wasm32 says nothing about whether the engine runs. Gather
      # now makes this gate stricter still: its static site includes the actual
      # project asset tree plus a manifest generated from those exact bytes,
      # and the browser must request every asset category over HTTP under a
      # non-root base path before the test accepts the rendered game. The same
      # harness then takes away the canvas and an adapter, and forces a device
      # failure, so startup failures have to be shown to a player rather than
      # living only in a developer console. The missing-WebGPU interface guard
      # is asserted directly in the exporter's page-template test because
      # Chromium no longer lets test code reliably hide its Navigator supplement.
      # The device case is the one the
      # page cannot check for itself: it fails after `init()` has resolved, and
      # a phone showing nothing but a blank canvas is what that looked like
      # before the engine started announcing it.
      - name: Run the engine in a browser
        timeout-minutes: 12
        run: |
          curl -fsSL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
          npm install --prefix scripts/browser
          npx --prefix scripts/browser playwright install --with-deps chromium
          wasm-pack build examples/cube --target web --out-dir pkg
          wasm-pack build game --target web --out-dir pkg
          # Everything below runs against the *exported* directory rather than
          # the source tree. That is the point: what CI proves is what a
          # deployment would serve, page and manifest and hashed assets and all.
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            game target/dist/gather --base /sindri2/
          cp -R game/pkg/. target/dist/gather/pkg/
          node scripts/browser/smoke.mjs examples/cube target/render-artifacts/browser-cube.png
          SINDRI_EXPECT_ASSETS=1 SINDRI_BASE_PATH=/sindri2/ \
            node scripts/browser/smoke.mjs target/dist/gather target/render-artifacts/browser-gather.png
          SINDRI_EXPECT_FAILURE=canvas SINDRI_BASE_PATH=/sindri2/ \
            node scripts/browser/smoke.mjs target/dist/gather target/render-artifacts/browser-no-canvas.png
          SINDRI_EXPECT_FAILURE=adapter SINDRI_BASE_PATH=/sindri2/ \
            node scripts/browser/smoke.mjs target/dist/gather target/render-artifacts/browser-no-adapter.png
          SINDRI_EXPECT_FAILURE=device SINDRI_BASE_PATH=/sindri2/ \
            node scripts/browser/smoke.mjs target/dist/gather target/render-artifacts/browser-no-device.png
      - name: Upload browser captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-captures
          path: |
            target/render-artifacts/browser-cube.png
            target/render-artifacts/browser-gather.png
            target/render-artifacts/browser-no-canvas.png
            target/render-artifacts/browser-no-adapter.png
            target/render-artifacts/browser-no-device.png
          if-no-files-found: warn
          retention-days: 14
