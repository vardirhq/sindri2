name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Apply component namespace refactor
        if: github.event_name == 'pull_request' && github.head_ref == 'component/namespaces' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          replacements = {
              'sindri.grid_navigation': 'sindri.grid.navigation',
              'sindri.grid_occupant': 'sindri.grid.occupant',
              'sindri.sprite_animation': 'sindri.animation.sprite',
              'sindri.script': 'sindri.decay.script',
          }

          roots = [
              Path('crates/sindri-scene'),
              Path('crates/sindri-decay'),
              Path('crates/sindri-core/tests'),
              Path('editor'),
              Path('game'),
              Path('examples'),
              Path('docs'),
          ]
          files = {Path('README.md'), Path('ROADMAP.md'), Path('PROJECT_OVERVIEW.md')}
          for root in roots:
              if root.exists():
                  files.update(
                      p for p in root.rglob('*')
                      if p.is_file() and p.suffix in {'.rs', '.md', '.json'}
                  )

          migration = Path('crates/sindri-core/src/migration.rs')
          legacy = Path('crates/sindri-core/tests/fixtures/legacy')
          for path in sorted(files):
              if path == migration or legacy in path.parents:
                  continue
              text = path.read_text()
              changed = text
              for old, new in replacements.items():
                  changed = changed.replace(old, new)
              changed = re.sub(r'sindri\.audio(?![A-Za-z0-9_.])', 'sindri.audio.source', changed)
              if path.name.endswith('.scene.json'):
                  changed = changed.replace('"format_version": 4', '"format_version": 5', 1)
              if changed != text:
                  path.write_text(changed)

          scene = Path('crates/sindri-core/src/scene.rs')
          text = scene.read_text()
          old = 'pub const SCENE_FORMAT_VERSION: u32 = 4;'
          new = 'pub const SCENE_FORMAT_VERSION: u32 = 5;'
          if old not in text and new not in text:
              raise SystemExit('scene format version anchor not found')
          scene.write_text(text.replace(old, new, 1))

          migration_text = migration.read_text()
          registration = '''        migrator\n            .register(3, 4, name_the_parts_of_a_sheet)\n            .expect("built-in steps are registered once and move forward");\n'''
          if '.register(4, 5, namespace_components)' not in migration_text:
              if registration not in migration_text:
                  raise SystemExit('migration registration anchor not found')
              migration_text = migration_text.replace(
                  registration,
                  registration + '''        migrator\n            .register(4, 5, namespace_components)\n            .expect("built-in steps are registered once and move forward");\n''',
                  1,
              )

          function = r'''/// Format 5 gives subsystem-owned components stable hierarchical names.
///
/// Payloads do not change, only the keys naming them. A scene carrying both the
/// legacy and canonical spelling is ambiguous and is refused rather than
/// silently overwriting either payload.
fn namespace_components(document: &mut Value) -> Result<(), SceneMigrationError> {
    const RENAMES: [(&str, &str); 5] = [
        ("sindri.grid_navigation", "sindri.grid.navigation"),
        ("sindri.grid_occupant", "sindri.grid.occupant"),
        ("sindri.sprite_animation", "sindri.animation.sprite"),
        ("sindri.audio", "sindri.audio.source"),
        ("sindri.script", "sindri.decay.script"),
    ];

    let Some(entities) = document.get_mut("entities").and_then(Value::as_array_mut) else {
        return Ok(());
    };
    for entity in entities {
        let Some(fields) = entity.as_object_mut() else {
            continue;
        };
        let entity_id = fields
            .get("id")
            .and_then(Value::as_str)
            .unwrap_or("<an entity with no id>")
            .to_owned();
        let Some(components) = fields
            .get_mut("components")
            .and_then(Value::as_object_mut)
        else {
            continue;
        };
        for (old, new) in RENAMES {
            if components.contains_key(old) && components.contains_key(new) {
                return Err(SceneMigrationError::Unconvertible(format!(
                    "entity '{entity_id}' carries both legacy component '{old}' and canonical component '{new}'"
                )));
            }
            if let Some(payload) = components.remove(old) {
                components.insert(new.to_owned(), payload);
            }
        }
    }
    Ok(())
}

'''
          marker = '/// Which cell of which grid a normalized rect is, when it is one.\n'
          if 'fn namespace_components(' not in migration_text:
              if marker not in migration_text:
                  raise SystemExit('migration function anchor not found')
              migration_text = migration_text.replace(marker, function + marker, 1)
          migration.write_text(migration_text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          marker = '## [Unreleased]\n'
          entry = '- Namespace subsystem-owned scene components and add lossless scene format 4 → 5 migration for existing projects.\n'
          if marker in text and entry not in text:
              changelog.write_text(text.replace(marker, marker + '\n' + entry, 1))
          PY

          cargo fmt --all

          # The helper workflow was only a failed bootstrap attempt; the real
          # change should not leave maintenance machinery behind.
          rm -f .github/workflows/namespace-refactor.yml
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Namespace built-in scene components"
            git push origin HEAD:component/namespaces
          fi
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Install native build and software Vulkan dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        timeout-minutes: 5
        run: |
          mirrors=/etc/apt/apt-mirrors.txt
          if [ -f "$mirrors" ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' "$mirrors"
            if ! grep -q . "$mirrors"; then
              echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee "$mirrors" > /dev/null
            fi
          fi
          for list in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$list" ]; then
              sudo sed -i 's|://azure.archive.ubuntu.com/|://archive.ubuntu.com/|g' "$list"
            fi
          done
          cat "$mirrors" 2>/dev/null || true
          grep -rhE '^(deb |URIs:)' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null || true
          apt_get() {
            sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 "$@"
          }
          apt_get update
          apt_get install --yes imagemagick libasound2-dev libvulkan1 libxkbcommon-x11-0 mesa-vulkan-drivers xdotool xvfb
      - run: cargo clippy --workspace --all-targets --all-features
      - name: Test
        env:
          WGPU_BACKEND: vulkan
          SINDRI_REQUIRE_GPU: 1
        run: cargo test --workspace --all-features
      - name: Capture native editor runtime viewport
        env:
          WGPU_BACKEND: vulkan
        run: timeout 60s xvfb-run --auto-servernum --server-args="-screen 0 1600x1200x24" ./scripts/capture-editor.sh target/render-artifacts/editor-runtime-viewport.png
      - name: Capture scene-driven frame pipeline
        env:
          WGPU_BACKEND: vulkan
        run: cargo run --package sindri-cube --bin capture -- target/render-artifacts/scene-frame-pipeline.png
      - name: Capture the companion game mid-run
        env:
          WGPU_BACKEND: vulkan
        run: cargo run --package sindri-gather --bin gather-capture -- target/render-artifacts/gather.png
      - name: Verify captured colours
        run: |
          cargo run --package sindri-cube --bin verify -- target/render-artifacts/editor-runtime-viewport.png
          cargo run --package sindri-cube --bin verify -- target/render-artifacts/scene-frame-pipeline.png
      - name: Upload visual test captures
        uses: actions/upload-artifact@v7
        with:
          name: visual-test-captures
          path: |
            target/render-artifacts/editor-runtime-viewport.png
            target/render-artifacts/scene-frame-pipeline.png
            target/render-artifacts/gather.png
          if-no-files-found: error
          retention-days: 14
      - name: Check browser workspace
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --workspace --all-features --target wasm32-unknown-unknown
      - name: Test image decoding in the browser build
        run: |
          cargo install wasm-bindgen-cli --version 0.2.127 --locked
          cargo test --package sindri-assets --target wasm32-unknown-unknown \
            --test decode_compatibility
      - name: Run the engine in a browser
        timeout-minutes: 12
        run: |
          curl -fsSL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
          npm install --prefix scripts/browser
          npx --prefix scripts/browser playwright install --with-deps chromium
          wasm-pack build examples/cube --target web --out-dir pkg
          wasm-pack build game --target web --out-dir pkg
          cargo run --quiet --package sindri-assets --example manifest -- game/assets \
            > game/assets/sindri.manifest.json
          node scripts/browser/smoke.mjs examples/cube target/render-artifacts/browser-cube.png
          SINDRI_EXPECT_ASSETS=1 SINDRI_BASE_PATH=/sindri2/ \
            node scripts/browser/smoke.mjs game target/render-artifacts/browser-gather.png
          SINDRI_EXPECT_FAILURE=webgpu \
            node scripts/browser/smoke.mjs game target/render-artifacts/browser-no-webgpu.png
          SINDRI_EXPECT_FAILURE=canvas \
            node scripts/browser/smoke.mjs game target/render-artifacts/browser-no-canvas.png
          SINDRI_EXPECT_FAILURE=adapter \
            node scripts/browser/smoke.mjs game target/render-artifacts/browser-no-adapter.png
          SINDRI_EXPECT_FAILURE=device \
            node scripts/browser/smoke.mjs game target/render-artifacts/browser-no-device.png
      - name: Upload browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-captures
          path: |
            target/render-artifacts/browser-cube.png
            target/render-artifacts/browser-gather.png
            target/render-artifacts/browser-no-webgpu.png
            target/render-artifacts/browser-no-canvas.png
            target/render-artifacts/browser-no-adapter.png
            target/render-artifacts/browser-no-device.png
          if-no-files-found: warn
          retention-days: 14
