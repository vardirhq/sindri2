name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      # Before the tests, not only before the captures: the workspace has GPU
      # tests now, and SINDRI_REQUIRE_GPU makes a missing adapter fail them
      # rather than skip them on the one machine installed to run them.
      #
      # apt waits on the dpkg lock forever by default, and the runner image
      # holds it while unattended-upgrades runs. A step that normally takes
      # fifteen seconds sat there for a quarter of an hour twice in a row, and
      # would have held the runner until the six-hour job timeout. The lock
      # timeout gives up instead of waiting, the retries cover a slow mirror,
      # and the step timeout turns any remaining hang into a fast, legible
      # failure rather than a job nobody can tell apart from a slow one.
      - name: Install software Vulkan
        env:
          DEBIAN_FRONTEND: noninteractive
        timeout-minutes: 5
        run: |
          apt_get() {
            sudo apt-get -o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 "$@"
          }
          apt_get update
          apt_get install --yes imagemagick libvulkan1 libxkbcommon-x11-0 mesa-vulkan-drivers xdotool xvfb
      - name: Test
        env:
          WGPU_BACKEND: vulkan
          SINDRI_REQUIRE_GPU: 1
        run: cargo test --workspace --all-features
      - name: Capture native editor runtime viewport
        env:
          WGPU_BACKEND: vulkan
        run: timeout 60s xvfb-run --auto-servernum --server-args="-screen 0 1600x1200x24" ./scripts/capture-editor.sh target/render-artifacts/editor-runtime-viewport.png
      - name: Capture scene-driven frame pipeline
        env:
          WGPU_BACKEND: vulkan
        run: cargo run --package sindri-cube --bin capture -- target/render-artifacts/scene-frame-pipeline.png
      # Both images render the same scene, so both are held to the same colours.
      # The editor screenshot went unexamined for a release while its viewport
      # sampled through a view that decoded a second time: everything else
      # passed and only the picture was wrong.
      - name: Verify captured colours
        run: |
          cargo run --package sindri-cube --bin verify -- target/render-artifacts/editor-runtime-viewport.png
          cargo run --package sindri-cube --bin verify -- target/render-artifacts/scene-frame-pipeline.png
      - name: Upload visual test captures
        uses: actions/upload-artifact@v7
        with:
          name: visual-test-captures
          path: |
            target/render-artifacts/editor-runtime-viewport.png
            target/render-artifacts/scene-frame-pipeline.png
          if-no-files-found: error
          retention-days: 14
      - name: Check browser workspace
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --workspace --all-features --target wasm32-unknown-unknown
