name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A branch under review is pushed to several times in a row, and every push
# used to start a fourteen-minute run that nobody was waiting for by the time
# it finished. Superseded pull request runs are cancelled; main is not, because
# each commit there is the only record of whether that commit was green.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Incremental compilation caches state for a rebuild that never happens: each
  # job compiles once and exits. It only inflates the target directory, which is
  # then paid for again in cache upload and download time.
  CARGO_INCREMENTAL: 0
  # Nothing here debugs a CI binary interactively, and full debuginfo is the
  # largest single contributor to both link time and cache size. Line tables
  # keep panic backtraces pointing at real source lines, which is what a failing
  # check is actually read for.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # Nothing here compiles anything, so it reports in well under a minute and
  # catches the cheapest failures before a runner has spent four minutes on a
  # build that a missing newline was going to fail anyway.
  quick:
    name: Format and file sizes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - name: Check file sizes
        run: scripts/check-file-size.py

  # The isometric baker is a Node tool with no dependencies, so this is the
  # whole of its build: run its tests, then re-bake its fixture and check that
  # nothing about the result moved. A baked asset is checked into the
  # repository, and the only thing that makes that safe is a job that notices
  # when the pipeline stops producing it.
  baker:
    name: Isometric baker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Type stripping runs .ts directly, so the tool has no build step —
          # but it needs a Node new enough to do it without a flag.
          node-version: '22.18'
      - name: Test
        working-directory: tools/isometric-baker
        run: node --test test/*.test.ts
      - name: Check the fixture is still what its recipe bakes
        working-directory: tools/isometric-baker
        run: node src/cli.ts fixtures/project/prefabs/standing-stone.isobake.json --out fixtures/project --check
      - name: Check the baked game art is still what its recipes bake
        working-directory: tools/isometric-baker
        # The same promise the fixture makes, for the assets a game actually
        # ships. The detonation is the flat-view path, so this is also what
        # keeps `top-down` honest.
        run: |
          node src/cli.ts ../../games/orbital-last-stand/assets/textures/detonation.isobake.json \
            --out ../../games/orbital-last-stand/assets --check
      # Orbital Baked is a whole game's art rather than one asset, and it is the
      # reason this check matters more than it did: seven sheets are committed
      # here, and a recipe that stops producing what is checked in would show up
      # as art that quietly drifts from its source rather than as a failure.
      - name: Check the baked variant's art is still what its recipes bake
        working-directory: tools/isometric-baker
        run: |
          for recipe in ../../games/orbital-baked/assets/textures/*.isobake.json; do
            node src/cli.ts "$recipe" --out ../../games/orbital-baked/assets --check
          done

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull request runs restore the cache main wrote and do not write one
          # of their own. Every branch saving its own copy of a target directory
          # this size evicts the entries the next run was going to restore, so
          # the caching made runs slower rather than faster.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Clippy compiles the native dependency graph, so ALSA — which Rodio's
      # CPAL backend links on Linux — has to be present before it runs.
      - uses: ./.github/actions/linux-deps
        with:
          packages: libasound2-dev
      - run: cargo clippy --workspace --all-targets --all-features

  test:
    name: Test and render captures
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # SINDRI_REQUIRE_GPU makes a missing adapter fail the GPU tests rather
      # than skip them on the one machine installed to run them, so the software
      # Vulkan stack has to be here before the tests are.
      - uses: ./.github/actions/linux-deps
        with:
          packages: imagemagick libasound2-dev libvulkan1 libxkbcommon-x11-0 mesa-vulkan-drivers xdotool xvfb
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143
      # `cargo test` runs one test binary at a time, so the workspace's slowest
      # suite was serialised behind everything else however idle the runner
      # was. nextest runs every test in one pool across all binaries, which
      # turns the total into roughly the slowest single test rather than the
      # sum of the slowest per binary.
      - name: Test
        env:
          WGPU_BACKEND: vulkan
          SINDRI_REQUIRE_GPU: 1
        run: cargo nextest run --workspace --all-features
      # nextest does not run doctests -- it has no way to, they are compiled
      # and run by rustdoc rather than built into a test binary. Left out, the
      # switch above would have quietly dropped every example in the public
      # API's documentation from CI, so they are run here instead.
      - name: Test the documented examples
        run: cargo test --workspace --all-features --doc
      # The captures stay in this job rather than a parallel one of their own:
      # they run the same crates the tests just built, and a separate job would
      # spend longer recompiling them than the captures take.
      #
      # The editor is built in its own step first, because `cargo run` otherwise
      # compiles inside the capture's own budget. `capture-editor.sh` waits
      # thirty seconds for a window to appear, and that had been spent waiting
      # for rustc rather than for the editor: the capture failed with "window
      # did not appear" while the editor was still being linked, which is a true
      # statement about a window and a useless one about what went wrong. It had
      # been passing with about a second to spare, so any change to what the
      # cache already holds decides it.
      #
      # One `cargo build` for the one package, matching how the script runs it.
      # Building several packages in a single invocation unifies their features,
      # which resolves differently from `cargo run --package sindri-editor` on
      # its own -- the artifacts then do not match what the run wants and it
      # compiles them again, which is the whole of what this avoids.
      - name: Build the editor the capture runs
        run: cargo build --package sindri-editor
      - name: Capture native editor runtime viewport
        env:
          WGPU_BACKEND: vulkan
        run: timeout 60s xvfb-run --auto-servernum --server-args="-screen 0 1600x1200x24" ./scripts/capture-editor.sh target/render-artifacts/editor-runtime-viewport.png
      - name: Capture scene-driven frame pipeline
        env:
          WGPU_BACKEND: vulkan
        run: cargo run --package sindri-cube --bin capture -- target/render-artifacts/scene-frame-pipeline.png
      - name: Capture the companion game mid-run
        env:
          WGPU_BACKEND: vulkan
        run: cargo run --package sindri-gather --bin gather-capture -- target/render-artifacts/gather.png
      - name: Capture Last Stand spectacle on desktop and phone
        env:
          WGPU_BACKEND: vulkan
        run: |
          cargo run --package orbital-last-stand --bin orbital-capture -- target/render-artifacts/orbital-spectacle-desktop.png 1440 900 spectacle
          cargo run --package orbital-last-stand --bin orbital-capture -- target/render-artifacts/orbital-spectacle-phone.png 390 844 spectacle
      # Both images render the same scene, so both are held to the same colours.
      # The editor screenshot went unexamined for a release while its viewport
      # sampled through a view that decoded a second time: everything else
      # passed and only the picture was wrong.
      - name: Verify captured colours
        run: |
          cargo run --package sindri-cube --bin verify -- target/render-artifacts/editor-runtime-viewport.png
          cargo run --package sindri-cube --bin verify -- target/render-artifacts/scene-frame-pipeline.png
      - name: Upload visual test captures
        uses: actions/upload-artifact@v7
        with:
          name: visual-test-captures
          path: |
            target/render-artifacts/editor-runtime-viewport.png
            target/render-artifacts/scene-frame-pipeline.png
            target/render-artifacts/gather.png
            target/render-artifacts/orbital-spectacle-desktop.png
            target/render-artifacts/orbital-spectacle-phone.png
          if-no-files-found: error
          retention-days: 14

  wasm:
    name: Browser target
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Nothing in the wasm32 graph links ALSA — Rodio is a dependency only
      # under `cfg(not(target_arch = "wasm32"))` — but this job used to share a
      # runner that had it, and twenty seconds of apt is cheaper than finding
      # out from a red build that something in the graph moved.
      - uses: ./.github/actions/linux-deps
        with:
          packages: libasound2-dev
      # Built from source, this took a minute and forty seconds of every run to
      # produce a binary whose version is pinned anyway. The prebuilt release is
      # the same artifact without the compile. The version still has to match
      # the wasm-bindgen the workspace resolves.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.128
      - name: Check browser workspace
        run: cargo check --workspace --all-features --target wasm32-unknown-unknown
      # A texture that decodes natively and not in the browser build is the
      # failure the asset system's whole promise rests on, so the decode corpus
      # is run on the browser target too, in Node through wasm-bindgen's runner.
      - name: Test image decoding in the browser build
        run: |
          cargo test --package sindri-assets --target wasm32-unknown-unknown \
            --test decode_compatibility

  # Compiling for wasm32 says nothing about whether the engine runs. Gather
  # makes this gate stricter still: its static site includes the actual project
  # asset tree plus a manifest generated from those exact bytes, and the browser
  # must request every asset category over HTTP under a non-root base path
  # before the test accepts the rendered game. The same harness then takes away
  # the canvas and an adapter, and forces a device failure, so startup failures
  # have to be shown to a player rather than living only in a developer console.
  # The missing-WebGPU interface guard is asserted directly in the exporter's
  # page-template test because Chromium no longer lets test code reliably hide
  # its Navigator supplement. The device case is the one the page cannot check
  # for itself: it fails after `init()` has resolved, and a phone showing
  # nothing but a blank canvas is what that looked like before the engine
  # started announcing it.
  browser:
    name: Run the engine in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      # Chromium is launched with `--use-angle=vulkan --use-vulkan=swiftshader`,
      # so it needs the Vulkan loader on the machine. Playwright's own
      # `install-deps` does not provide it, and without it the browser still
      # reports `navigator.gpu` — `--enable-unsafe-webgpu` sees to that — and
      # then draws nothing, which reads as an engine that started and rendered
      # a blank frame rather than as a missing system library.
      - uses: ./.github/actions/linux-deps
        with:
          packages: libvulkan1 mesa-vulkan-drivers
      # Chromium and its npm tree are the same bytes on every run and are worth
      # roughly a minute of it. The system libraries the browser links are not
      # cached — `install-deps` is apt — so they are installed either way.
      - name: Cache browser tooling
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            scripts/browser/node_modules
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/browser/package.json') }}
      - name: Install browser tooling
        run: |
          npm install --prefix scripts/browser
          npx --prefix scripts/browser playwright install-deps chromium
          npx --prefix scripts/browser playwright install chromium
      - name: Build the browser bundles
        run: |
          wasm-pack build examples/cube --target web --out-dir pkg
          wasm-pack build game --target web --out-dir pkg
      # Everything below runs against the *exported* directory rather than the
      # source tree. That is the point: what CI proves is what a deployment
      # would serve, page and manifest and hashed assets and all.
      - name: Export the browser projects
        run: |
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            game target/dist/gather --base /sindri2/
          cp -R game/pkg/. target/dist/gather/pkg/
          # The acceptance project, exported and served the same way. It is the
          # one with prefabs — including prefabs only another prefab names —
          # and with screens that are switched off until something shows them,
          # so it is the build that proves those reach a browser.
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            games/orbital-last-stand target/dist/orbital --base /sindri2/
          cp -R game/pkg/. target/dist/orbital/pkg/
          # Weave uses the same generic browser host, but adds an Other asset
          # that the host recognizes as a presentation stylesheet.
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            games/weave-poc target/dist/weave --base /sindri2/examples/weave-poc/
          cp -R game/pkg/. target/dist/weave/pkg/
          # The baked variant, which is the one deployed to Pages that a person
          # actually plays. Its title screen is laid out by Weave rather than by
          # its scene, and its portrait rules are reached only in a browser at
          # phone width -- so nothing else here looks at them.
          cargo run --quiet --package sindri-export --bin sindri-export -- \
            games/orbital-baked target/dist/orbital-baked --base /sindri2/
          cp -R game/pkg/. target/dist/orbital-baked/pkg/
      - name: Smoke the rendered games
        run: |
          node scripts/browser/smoke.mjs examples/cube target/render-artifacts/browser-cube.png
          SINDRI_EXPECT_ASSETS=1 SINDRI_BASE_PATH=/sindri2/ \
            node scripts/browser/smoke.mjs target/dist/gather target/render-artifacts/browser-gather.png
          SINDRI_EXPECT_ASSETS=1 SINDRI_BASE_PATH=/sindri2/ \
            node scripts/browser/smoke.mjs target/dist/orbital target/render-artifacts/browser-orbital.png
          SINDRI_EXPECT_ASSETS=1 \
            SINDRI_BASE_PATH=/sindri2/examples/weave-poc/ \
            SINDRI_VIEWPORT_WIDTH=390 SINDRI_VIEWPORT_HEIGHT=844 \
            node scripts/browser/smoke.mjs target/dist/weave target/render-artifacts/browser-weave-phone.png
          SINDRI_EXPECT_ASSETS=1 SINDRI_BASE_PATH=/sindri2/ \
            SINDRI_VIEWPORT_WIDTH=390 SINDRI_VIEWPORT_HEIGHT=844 \
            node scripts/browser/smoke.mjs target/dist/orbital-baked target/render-artifacts/browser-orbital-baked-phone.png
      - name: Smoke the startup failure paths
        run: |
          SINDRI_EXPECT_FAILURE=canvas SINDRI_BASE_PATH=/sindri2/ \
            node scripts/browser/smoke.mjs target/dist/gather target/render-artifacts/browser-no-canvas.png
          SINDRI_EXPECT_FAILURE=adapter SINDRI_BASE_PATH=/sindri2/ \
            node scripts/browser/smoke.mjs target/dist/gather target/render-artifacts/browser-no-adapter.png
          SINDRI_EXPECT_FAILURE=device SINDRI_BASE_PATH=/sindri2/ \
            node scripts/browser/smoke.mjs target/dist/gather target/render-artifacts/browser-no-device.png
      - name: Upload browser captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-captures
          path: |
            target/render-artifacts/browser-cube.png
            target/render-artifacts/browser-gather.png
            target/render-artifacts/browser-orbital.png
            target/render-artifacts/browser-weave-phone.png
            target/render-artifacts/browser-orbital-baked-phone.png
            target/render-artifacts/browser-no-canvas.png
            target/render-artifacts/browser-no-adapter.png
            target/render-artifacts/browser-no-device.png
          if-no-files-found: warn
          retention-days: 14
