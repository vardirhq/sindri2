name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features
      - name: Install software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install --yes libvulkan1 mesa-vulkan-drivers
      - name: Capture scene-driven frame pipeline
        env:
          WGPU_BACKEND: vulkan
        run: cargo run --package sindri-cube --bin capture -- target/render-artifacts/scene-frame-pipeline.png
      - name: Upload scene-driven frame pipeline
        uses: actions/upload-artifact@v4
        with:
          name: scene-frame-pipeline-preview
          path: target/render-artifacts/scene-frame-pipeline.png
          if-no-files-found: error
          retention-days: 14
      - name: Check browser workspace
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --workspace --all-features --target wasm32-unknown-unknown
