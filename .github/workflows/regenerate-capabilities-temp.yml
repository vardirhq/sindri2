name: Regenerate capabilities temp

on:
  push:
    branches:
      - feature/weave-alignment-flex

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/weave-alignment-flex
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Regenerate capability documents
        run: cargo run --quiet -p sindri-capabilities -- --write
      - name: Commit generated metadata
        run: |
          if git diff --quiet -- docs/generated; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/generated
          git commit -m 'docs: regenerate Sindri capabilities'
          git push origin HEAD:feature/weave-alignment-flex
