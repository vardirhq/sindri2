name: One-shot audio docs patch

on:
  push:
    branches: [codex/audio-end-to-end]
    paths: [.github/workflows/patch-audio-docs.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/audio-end-to-end
      - name: Reconcile audio documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          scripting = Path("docs/scripting.md")
          text = scripting.read_text()
          marker = "### The keyboard\n"
          section = '''### Audio\n\n| Call | Returns |\n| --- | --- |\n| `Audio.play(clip, volume)` | nothing |\n| `Audio.loop(clip, volume)` | nothing |\n| `Audio.stop_all()` | nothing |\n| `Audio.pause_all()` | nothing |\n| `Audio.resume_all()` | nothing |\n\n`clip` is a logical audio asset ID and `volume` is a finite normalized number\nfrom 0 through 1. `play` is one-shot and `loop` repeats until stopped. Decay\nonly emits typed playback intent; it never owns or talks to an audio device.\nThe host drains those requests through the platform audio boundary, which keeps\nheadless tests silent and lets browser playback obey its user-interaction unlock\nwithout teaching the language about either platform.\n\n'''
          if section not in text:
              if marker not in text:
                  raise SystemExit("scripting insertion marker not found")
              text = text.replace(marker, section + marker, 1)
              scripting.write_text(text)

          capabilities = Path("docs/capabilities.md")
          text = capabilities.read_text()
          marker = "### Grid geometry\n"
          section = '''### Audio\n\nAudio is a platform service rather than simulation state. Encoded WAV, Ogg, and\nMP3 assets are identified and validated by the asset layer, then registered with\nan `AudioBackend`. Native hosts use Rodio/CPAL, browser hosts use media elements\nwith an explicit user-interaction unlock, and headless tests use a silent backend\nthat records every request without needing a sound device. The shared boundary\nsupports one-shot and looping playback plus per-voice stop and global pause,\nresume, and stop.\n\nScenes can author `sindri.audio` with a logical clip ID, autoplay, looping, and a\nnormalized volume. The generic component inspector can add and edit it, and the\nproject browser recognises WAV/Ogg/MP3 files as audio assets. Decay exposes typed\n`Audio.play`, `loop`, `stop_all`, `pause_all`, and `resume_all` calls while only\nemitting intent, so the language itself retains its no-I/O boundary. Gather\nexercises the path end to end with background, pickup, and victory sounds on\nnative and browser hosts.\n\n'''
          if section not in text:
              if marker not in text:
                  raise SystemExit("capabilities insertion marker not found")
              text = text.replace(marker, section + marker, 1)
              capabilities.write_text(text)

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          marker = "### Added\n\n"
          bullet = "- End-to-end audio across assets, scene authoring, native/browser platform backends, typed Decay calls, editor discovery/component authoring, and Gather background/pickup/victory playback, with a silent backend for device-free tests.\n"
          if bullet not in text:
              if marker not in text:
                  raise SystemExit("changelog insertion marker not found")
              text = text.replace(marker, marker + bullet, 1)
              changelog.write_text(text)
          PY
          rm .github/workflows/patch-audio-docs.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/scripting.md docs/capabilities.md CHANGELOG.md .github/workflows/patch-audio-docs.yml
          git commit -m "Document end-to-end audio support"
          git push origin HEAD:codex/audio-end-to-end
