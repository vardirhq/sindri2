name: Normalize Decay LSP branch

on:
  push:
    branches: [feature/decay-lsp]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/decay-lsp
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Apply mechanical fixes and format
        run: |
          sed -i 's/\.entity_ids/\.entity_names/g' tools/decay-lsp/src/main.rs
          cargo fmt --all
      - name: Commit normalized sources
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "Normalize Decay language server sources"
          git push
