name: Temporary camera manifest debug

on:
  push:
    branches:
      - tmp-camera-manifest-debug

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Migrate cube scene with Sindri
        run: cargo run -p sindri-core --example tmp_migrate_cube_scene
      - name: Regenerate cube manifest
        run: cargo run -p sindri-assets --example manifest -- examples/cube/assets > /tmp/sindri.manifest.json && mv /tmp/sindri.manifest.json examples/cube/assets/sindri.manifest.json
      - name: Remove temporary helper
        run: rm crates/sindri-core/examples/tmp_migrate_cube_scene.rs
      - name: Verify repaired asset pair
        run: |
          wc -c examples/cube/assets/demo.scene.json
          sha256sum examples/cube/assets/demo.scene.json
          cat examples/cube/assets/sindri.manifest.json
          grep -q '"format_version": 6' examples/cube/assets/demo.scene.json
      - name: Commit repaired assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add examples/cube/assets/demo.scene.json examples/cube/assets/sindri.manifest.json
          git commit -m "Repair migrated cube scene asset"
          git push
