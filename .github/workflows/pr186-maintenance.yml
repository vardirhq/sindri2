name: PR 186 maintenance

on:
  push:
    branches:
      - codex/last-stand-module-registry

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Regenerate capability documents
        run: cargo run -p sindri-capabilities -- --write
      - name: Commit generated fixes and remove this workflow
        run: |
          rm .github/workflows/pr186-maintenance.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Apply formatting and generated profile docs"
          git push origin HEAD:codex/last-stand-module-registry
