name: Finalize audio integration

on:
  push:
    branches: [codex/audio-end-to-end]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message != 'Apply cargo fmt and lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/audio-end-to-end
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Finish scene and editor audio authoring
        shell: python
        run: |
          from pathlib import Path
          import json

          path = Path('crates/sindri-scene/src/extract.rs')
          text = path.read_text()
          if 'AudioSourceComponent' not in text:
              text = text.replace(
                  '    AnimationError, CameraComponent, GridNavigationComponent, GridOccupantComponent, MeshComponent,\n',
                  '    AnimationError, AudioSourceComponent, CameraComponent, GridNavigationComponent,\n    GridOccupantComponent, MeshComponent,\n',
              )
              marker = '        components.register::<GridOccupantComponent>("Grid Occupant")?;\n        Ok(Self { components })'
              replacement = '''        components.register::<GridOccupantComponent>("Grid Occupant")?;
          components.register_with_default::<AudioSourceComponent>(
              "Audio Source",
              serde_json::json!({
                  "clip": "",
                  "autoplay": false,
                  "looping": false,
                  "volume": 1.0
              }),
          )?;
          Ok(Self { components })'''
              if marker not in text:
                  raise SystemExit('SceneExtractor registration marker changed')
              path.write_text(text.replace(marker, replacement))

          path = Path('editor/src/project.rs')
          text = path.read_text()
          if '    Audio,\n' not in text:
              text = text.replace('    Font,\n    Other,', '    Font,\n    Audio,\n    Other,')
              text = text.replace(
                  '            Self::Font => "Font",\n            Self::Other => "File",',
                  '            Self::Font => "Font",\n            Self::Audio => "Audio",\n            Self::Other => "File",',
              )
              text = text.replace(
                  '            Some("ttf" | "otf" | "woff" | "woff2") => Self::Font,\n            _ => Self::Other,',
                  '            Some("ttf" | "otf" | "woff" | "woff2") => Self::Font,\n            Some("wav" | "ogg" | "mp3") => Self::Audio,\n            _ => Self::Other,',
              )
              path.write_text(text)

          path = Path('game/assets/gather.scene.json')
          scene = json.loads(path.read_text())
          if not any(entity.get('id') == 'music' for entity in scene['entities']):
              scene['entities'].append({
                  'id': 'music',
                  'name': 'Music',
                  'transform_3d': {
                      'position': [0.0, 0.0, 0.0],
                      'rotation': [0.0, 0.0, 0.0, 1.0],
                      'scale': [1.0, 1.0, 1.0],
                  },
                  'components': {
                      'sindri.audio': {
                          'clip': 'audio/background.wav',
                          'autoplay': True,
                          'looping': True,
                          'volume': 0.22,
                      }
                  },
              })
              path.write_text(json.dumps(scene, indent=2) + '\n')
      - name: Refresh lockfile and formatting
        run: |
          cargo update --workspace
          cargo fmt --all
      - name: Commit mechanical updates
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Apply cargo fmt and lockfile'
          git push origin HEAD:codex/audio-end-to-end
