name: One-shot audio icon patch

on:
  push:
    branches: [codex/audio-end-to-end]
    paths: [.github/workflows/patch-native-audio.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/audio-end-to-end
      - name: Patch exhaustive asset icon mapping
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("editor/src/native.rs")
          text = path.read_text()
          old = "        AssetKind::Script => ICON_CODE,\n        AssetKind::Other => ICON_DEPLOYED_CODE,"
          new = "        AssetKind::Script => ICON_CODE,\n        AssetKind::Audio => ICON_PLAY_ARROW,\n        AssetKind::Other => ICON_DEPLOYED_CODE,"
          if new in text:
              raise SystemExit("audio icon arm already present")
          if old not in text:
              raise SystemExit("expected asset_icon match not found")
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/patch-native-audio.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add editor/src/native.rs .github/workflows/patch-native-audio.yml
          git commit -m "Wire audio asset icon in editor"
          git push origin HEAD:codex/audio-end-to-end
