name: Navigation boundary fix
on:
  push:
    branches: [codex/pathfinding-vertical]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event_name == 'pull_request' || github.event.head_commit.message != 'Keep Decay navigation scene-independent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/pathfinding-vertical
      - name: Apply dependency-safe navigation boundary
        run: python3 .github/navigation_boundary_fix.py
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Format and verify
        run: |
          cargo fmt --all
          cargo test --workspace --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo check --workspace --all-features --target wasm32-unknown-unknown
      - name: Commit and remove helper
        run: |
          rm .github/navigation_boundary_fix.py .github/workflows/navigation-boundary-fix.yml
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git add -A
          git commit -m 'Keep Decay navigation scene-independent'
          git push origin HEAD:codex/pathfinding-vertical
