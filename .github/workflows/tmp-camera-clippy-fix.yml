name: Temporary camera clippy fix

on:
  push:
    branches:
      - tmp-camera-clippy-fix

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt,clippy
      - name: Refactor migration helpers
        run: python scripts/tmp_refactor_camera_migration.py
      - name: Remove temporary helper
        run: rm scripts/tmp_refactor_camera_migration.py
      - name: Format and lint core
        run: |
          cargo fmt --all
          cargo clippy -p sindri-core --all-targets --all-features -- -D warnings
          cargo test -p sindri-core --all-features
      - name: Commit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/sindri-core/src/migration.rs
          git commit -m "Refactor camera migration helpers"
          git push
