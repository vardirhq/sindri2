name: Canonicalize Gather scene

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/audio-end-to-end
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install native audio headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev
      - name: Canonicalize Gather scene
        env:
          SINDRI_UPDATE_GATHER_SCENE: "1"
        run: cargo test --package sindri-gather --test the_game_holds_together the_scene_file_is_canonical
      - name: Commit canonical scene and remove helper
        run: |
          rm .github/workflows/canonicalize-gather.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/assets/gather.scene.json .github/workflows/canonicalize-gather.yml
          git commit -m "Canonicalize Gather scene"
          git push
