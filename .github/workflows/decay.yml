name: Decay

on:
  push:
    branches:
      - main
      - 'feat/decay-*'
    paths:
      - 'decay/**'
      - '.github/workflows/decay.yml'
  pull_request:
    paths:
      - 'decay/**'
      - '.github/workflows/decay.yml'

permissions:
  contents: write

jobs:
  check:
    name: Decay workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: decay
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: decay
      - name: Apply Clippy fixes
        if: github.event_name == 'pull_request'
        run: cargo clippy --fix --workspace --all-targets --allow-dirty --allow-staged -- -D warnings
      - name: Apply rustfmt
        if: github.event_name == 'pull_request'
        run: cargo fmt --all
      - name: Commit automatic fixes
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          if ! git diff --quiet -- decay; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- decay
            git commit -m "style(decay): apply clippy fixes"
            git pull --rebase origin "${{ github.event.pull_request.head.ref }}"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
