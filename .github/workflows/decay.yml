name: Decay

on:
  push:
    branches:
      - main
      - 'feat/decay-*'
    paths:
      - 'decay/**'
      - '.github/workflows/decay.yml'
  pull_request:
    paths:
      - 'decay/**'
      - '.github/workflows/decay.yml'

permissions:
  contents: read

jobs:
  check:
    name: Decay workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: decay
    steps:
      - uses: actions/checkout@v7
      # The repository root pins 1.95.0 in rust-toolchain.toml, and rustup
      # honours it from any subdirectory -- so `stable` here was never what
      # ran. Naming the same version says what happens, and keeps saying it if
      # Decay is ever extracted to a repository of its own.
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: decay
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # Reaching the browser is the reason this language exists rather than an
      # embedded Lua: vendored C Lua cannot target wasm32-unknown-unknown at
      # all. Decay compiles for it today, and a check is the only thing that
      # keeps that true.
      - name: Browser target
        run: cargo check --workspace --all-targets --target wasm32-unknown-unknown
