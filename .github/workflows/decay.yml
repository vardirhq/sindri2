name: Decay

on:
  push:
    branches:
      - main
      - 'feat/decay-*'
    paths:
      - 'decay/**'
      - '.github/workflows/decay.yml'
  pull_request:
    paths:
      - 'decay/**'
      - '.github/workflows/decay.yml'

permissions:
  contents: write

jobs:
  check:
    name: Decay workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: decay
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: decay
      - name: Apply structural Clippy fixes
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          parser = Path("crates/decay-syntax/src/parser.rs")
          text = parser.read_text()
          text = text.replace(
              "use crate::{Diagnostic, Span, Token, TokenKind, ast::*, lex, line_column};",
              "use crate::{ast::{AssignOp, Attribute, BinaryOp, Block, ContainerDecl, Expr, ExprKind, FieldDecl, FunctionDecl, Item, Member, Param, Program, Stmt, TypeRef, UnaryOp}, Diagnostic, Span, Token, TokenKind, lex, line_column};",
          )
          text = text.replace(
              "        loop {\n            let Some((precedence, op)) = binary_operator(&self.current().kind) else {\n                break;\n            };\n            if precedence < min_precedence {",
              "        while let Some((precedence, op)) = binary_operator(&self.current().kind) {\n            if precedence < min_precedence {",
          )
          text = text.replace("expect_simple(TokenKind::", "expect_simple(&TokenKind::")
          text = text.replace("expected: TokenKind, message: &str", "expected: &TokenKind, message: &str")
          text = text.replace("self.at(&expected)", "self.at(expected)")
          parser.write_text(text)

          semantic = Path("crates/decay-semantic/src/lib.rs")
          text = semantic.read_text()
          text = text.replace("self.compatible(", "Self::compatible(")
          text = text.replace("fn compatible(&self, expected: &Type, actual: &Type)", "fn compatible(expected: &Type, actual: &Type)")
          semantic.write_text(text)
          PY
      - name: Apply machine Clippy fixes
        if: github.event_name == 'pull_request'
        run: cargo clippy --fix --workspace --all-targets --allow-dirty --allow-staged -- -D warnings
      - name: Apply rustfmt
        if: github.event_name == 'pull_request'
        run: cargo fmt --all
      - name: Commit automatic fixes
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          if ! git diff --quiet -- decay; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- decay
            git commit -m "style(decay): satisfy clippy"
            git pull --rebase origin "${{ github.event.pull_request.head.ref }}"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
