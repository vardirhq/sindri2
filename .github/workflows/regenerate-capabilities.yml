name: Regenerate capabilities artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Regenerate capabilities
        run: cargo run -p sindri-capabilities -- --write
      - name: Report stale generated capabilities
        id: stale
        shell: bash
        run: |
          if git diff --quiet -- docs/generated/; then
            echo "Generated capability documents are current."
            exit 0
          fi

          mapfile -t changed < <(git diff --name-only -- docs/generated/)
          {
            echo "## Generated capability documents are stale"
            echo
            echo "The capability generator completed successfully, but the pull request does not contain its current output."
            echo
            echo "Changed generated files:"
            printf -- '- `%s`\n' "${changed[@]}"
            echo
            echo "### Apply locally"
            echo
            echo '```bash'
            echo 'cargo run -p sindri-capabilities -- --write'
            echo 'git add docs/generated/'
            echo 'git commit -m "Regenerate capability documents"'
            echo 'git push'
            echo '```'
            echo
            echo "The exact regenerated files are also attached to this workflow run as the \`regenerated-capabilities\` artifact."
          } >>"$GITHUB_STEP_SUMMARY"

          echo "::warning title=Generated capability documents are stale::$(IFS=', '; echo "${changed[*]}")"
      - name: Upload generated capabilities
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-capabilities
          path: docs/generated/
