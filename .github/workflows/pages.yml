name: Sindri Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Sindri site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install site tools
        run: |
          cargo install wasm-pack --version 0.13.1 --locked
          python -m pip install --disable-pip-version-check 'Markdown==3.8.2'
      - name: Build Gather for WebGPU
        run: wasm-pack build game --target web --release --out-dir ../target/pages/examples/gather/pkg
      - name: Assemble Sindri site
        run: |
          mkdir -p target/pages/assets target/pages/examples/gather/assets
          cp site/index.html target/pages/index.html
          cp site/site.css target/pages/assets/site.css
          cp game/index.html target/pages/examples/gather/index.html
          cp -R game/assets/. target/pages/examples/gather/assets/
          cargo run --quiet --package sindri-assets --example manifest -- game/assets \
            > target/pages/examples/gather/assets/sindri.manifest.json
          python site/build_docs.py target/pages
          touch target/pages/.nojekyll
      - name: Verify assembled routes
        run: |
          test -f target/pages/index.html
          test -f target/pages/docs/scripting/index.html
          test -f target/pages/docs/language/index.html
          test -f target/pages/examples/gather/index.html
          test -f target/pages/examples/gather/pkg/sindri_gather.js
          test -f target/pages/examples/gather/pkg/sindri_gather_bg.wasm
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/pages

  deploy:
    name: Deploy Sindri site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
