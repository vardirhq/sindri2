name: Gather Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Gather for WebGPU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Build Gather
        run: wasm-pack build game --target web --release --out-dir ../target/pages/pkg
      - name: Assemble static site and project assets
        run: |
          cp game/index.html target/pages/index.html
          mkdir -p target/pages/assets
          cp -R game/assets/. target/pages/assets/
          cargo run --quiet --package sindri-assets --example manifest -- game/assets \
            > target/pages/assets/sindri.manifest.json
          touch target/pages/.nojekyll
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/pages

  deploy:
    name: Deploy Gather
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
