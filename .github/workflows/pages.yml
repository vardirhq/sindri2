name: Sindri Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Sindri site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # wasm-pack from its prebuilt release rather than a source build: the
      # binary is identical and the compile was minutes of every deploy.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      - name: Install site tools
        run: python -m pip install --disable-pip-version-check 'Markdown==3.8.2'
      - name: Build the browser host
        run: wasm-pack build game --target web --release --out-dir pkg
      - name: Assemble Sindri site
        run: |
          mkdir -p target/pages/assets
          cp site/index.html target/pages/index.html
          cp site/site.css target/pages/assets/site.css
          # Both games are *exported* rather than assembled by hand. The export
          # is what decides what a project ships, and a site that copied an
          # asset directory instead was a second answer to that question --
          # one that wrote a manifest naming no kinds, which the host reads to
          # know what to ask for, so it shipped a game that loaded nothing.
          for project in "game:gather" "games/orbital-last-stand:orbital-last-stand"; do
            src="${project%%:*}"
            route="${project##*:}"
            # The commit is the build id: it versions the host's URL, so a
            # returning device cannot run a cached host against fresh assets,
            # and it is printed in the corner of the page so a fault report can
            # name the build it came from.
            cargo run --quiet --package sindri-export --bin sindri-export -- \
              "$src" "target/pages/examples/$route" --base "/sindri2/examples/$route/" \
              --build-id "${GITHUB_SHA:0:7}"
            # One host serves every project: it reads the manifest rather than
            # carrying a list of one game's assets.
            mkdir -p "target/pages/examples/$route/pkg"
            cp -R game/pkg/. "target/pages/examples/$route/pkg/"
          done
          python site/build_docs.py target/pages
          touch target/pages/.nojekyll
      - name: Verify assembled routes
        run: |
          test -f target/pages/index.html
          test -f target/pages/docs/scripting/index.html
          test -f target/pages/docs/language/index.html
          for route in gather orbital-last-stand; do
            test -f "target/pages/examples/$route/index.html"
            test -f "target/pages/examples/$route/assets/sindri.manifest.json"
            test -f "target/pages/examples/$route/pkg/sindri_gather.js"
            test -f "target/pages/examples/$route/pkg/sindri_gather_bg.wasm"
            # A manifest that names no scene is a game that will not open, and
            # it is what a hand-written one produced.
            grep -q '"kind": "scene"' "target/pages/examples/$route/assets/sindri.manifest.json"
          done
          grep -q '"kind": "prefab"' target/pages/examples/orbital-last-stand/assets/sindri.manifest.json
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/pages

  deploy:
    name: Deploy Sindri site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
