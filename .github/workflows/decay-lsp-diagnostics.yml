name: Fix Decay LSP clippy

on:
  push:
    branches: [feature/decay-lsp]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/decay-lsp
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - name: Install audio headers
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      - name: Fix ownership warnings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          protocol = Path('tools/decay-lsp/src/protocol.rs')
          text = protocol.read_text()
          text = text.replace('io::{self, BufRead, Read, Write}', 'io::{self, BufRead, Write}')
          protocol.write_text(text)

          main = Path('tools/decay-lsp/src/main.rs')
          text = main.read_text()
          text = text.replace('fn handle(&mut self, message: Value,', 'fn handle(&mut self, message: &Value,')
          text = text.replace('self.respond(', 'Self::respond(')
          pattern = re.compile(
              r'    fn respond\(&self, id: Option<Value>, result: Value, output: &mut impl Write\) -> io::Result<\(\)> \{.*?\n    \}\n\n    fn did_open',
              re.S,
          )
          replacement = '''    fn respond(id: Option<Value>, result: Value, output: &mut impl Write) -> io::Result<()> {
              if let Some(id) = id {
                  let mut response = serde_json::Map::new();
                  response.insert("jsonrpc".to_owned(), Value::String("2.0".to_owned()));
                  response.insert("id".to_owned(), id);
                  response.insert("result".to_owned(), result);
                  write_message(output, &Value::Object(response))?;
              }
              Ok(())
          }

          fn did_open'''
          text, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f'expected to replace respond once, replaced {count}')
          text = text.replace('server.handle(message, &mut output)?', 'server.handle(&message, &mut output)?')
          main.write_text(text)
          PY
          rm -f decay-lsp-clippy.txt .github/decay-lsp-diagnostics-trigger
          cargo fmt --all
      - name: Verify Decay LSP
        run: cargo clippy --package decay-lsp --all-targets --all-features -- -D warnings
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix Decay language server lint warnings"
          git pull --rebase origin feature/decay-lsp
          git push
