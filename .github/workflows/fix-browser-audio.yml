name: Fix browser audio Promise

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/audio-end-to-end
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - name: Make Promise handling explicit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/sindri-platform/src/audio.rs')
          text = path.read_text()
          old = '''        element
            .play()
            .map_err(|error| AudioError::Browser(format!("playback was rejected: {error:?}")))?;
'''
          new = '''        let _playback = element
            .play()
            .map_err(|error| AudioError::Browser(format!("playback was rejected: {error:?}")))?;
'''
          if old not in text:
              raise SystemExit('expected browser audio play call not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify browser workspace
        run: cargo check --workspace --all-features --target wasm32-unknown-unknown
      - name: Commit fix and remove helper
        run: |
          rm .github/workflows/fix-browser-audio.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/sindri-platform/src/audio.rs .github/workflows/fix-browser-audio.yml
          git commit -m "Handle browser audio play Promise"
          git push
