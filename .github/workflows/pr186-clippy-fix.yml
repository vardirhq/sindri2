name: PR 186 clippy fix

on:
  push:
    branches:
      - codex/last-stand-module-registry

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Merge identical project icon arms
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('editor/src/native/project_panel/mod.rs')
          text = path.read_text()
          old = '''        AssetKind::Prefab => icons::PREFAB,\n        AssetKind::Profile => icons::FILE,\n        AssetKind::Script => icons::SCRIPT,\n        AssetKind::Audio => icons::AUDIO,\n        AssetKind::Other => icons::FILE,\n'''
          new = '''        AssetKind::Prefab => icons::PREFAB,\n        AssetKind::Profile | AssetKind::Other => icons::FILE,\n        AssetKind::Script => icons::SCRIPT,\n        AssetKind::Audio => icons::AUDIO,\n'''
          if old not in text:
              raise SystemExit('expected icon match not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/pr186-clippy-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add editor/src/native/project_panel/mod.rs .github/workflows/pr186-clippy-fix.yml
          git commit -m "Fix profile project panel clippy"
          git push
