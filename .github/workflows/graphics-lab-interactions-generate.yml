name: Generate Graphics Lab Interactions

on:
  push:
    branches: [codex/graphics-lab-interactions]
    paths:
      - "games/graphics-lab/assets/scripts/showcase.decay"
      - ".github/workflows/graphics-lab-interactions-generate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/graphics-lab-interactions
      - name: Add interactive scene metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/generate-graphics-lab-scene.py')
          text = path.read_text()
          old = '''def write():\n    build()\n'''
          new = '''def write():\n    build()\n\n    # Only scene roots receive direct pointer hit tests. Their descendants\n    # inherit the resulting transform burst through hierarchy, so one tap\n    # animates the entire sculpture without every child competing for input.\n    interactions = {\n        "core": (1.85, 1.0),\n        "boss": (1.75, 2.0),\n        "ship": (1.55, 3.0),\n        "portal": (1.6, 4.0),\n        "singularity": (1.55, 5.0),\n        "asteroid-0": (1.0, 2.0),\n        "asteroid-1": (1.0, 3.0),\n        "asteroid-2": (1.0, 4.0),\n        "asteroid-3": (1.0, 5.0),\n    }\n    for entity in ENTITIES:\n        interaction = interactions.get(entity["id"])\n        if interaction is None:\n            continue\n        script_component = entity.get("components", {}).get("sindri.script")\n        if script_component is None:\n            continue\n        tap_radius, tap_mode = interaction\n        script_component["properties"]["tap_radius"] = tap_radius\n        script_component["properties"]["tap_mode"] = tap_mode\n'''
          if old not in text:
              raise SystemExit('write() anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python scripts/generate-graphics-lab-scene.py
      - name: Commit generated interaction metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-graphics-lab-scene.py games/graphics-lab/assets/graphics-lab.scene.json
          git commit -m "Make Graphics Lab sculptures tappable"
          git rm .github/workflows/graphics-lab-interactions-generate.yml
          git commit -m "Remove interaction generator workflow"
          git push
