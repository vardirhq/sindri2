name: Pathfinding vertical implementation
on:
  push:
    branches: [codex/pathfinding-vertical]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  implement:
    if: github.event_name != 'push' || github.event.head_commit.message != 'Complete pathfinding vertical slice'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/pathfinding-vertical
      - name: Apply implementation
        run: python3 .github/pathfinding_impl.py
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - name: Install native audio dependency
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Canonicalize Gather scene
        env:
          SINDRI_UPDATE_GATHER_SCENE: '1'
        run: cargo test --package sindri-gather --test the_game_holds_together the_scene_file_is_canonical
      - name: Format and test changed surfaces
        run: |
          cargo fmt --all
          cargo test --package sindri-decay --package sindri-editor --package sindri-gather --all-features
          cargo clippy --workspace --all-targets --all-features
      - name: Commit implementation and remove helpers
        if: github.event_name == 'push'
        run: |
          rm .github/workflows/pathfinding-dev.yml .github/pathfinding_impl.py
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git add -A
          git commit -m 'Complete pathfinding vertical slice'
          git push origin HEAD:codex/pathfinding-vertical
