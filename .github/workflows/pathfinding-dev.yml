              ]
          }
          if not any(e['id'] == 'wisp' for e in scene['entities']):
              scene['entities'].append({
                  'id': 'wisp',
                  'name': 'Wisp',
                  'transform_3d': {
                      'position': [0.0, 1.65, 0.1],
                      'rotation': [0.0, 0.0, 0.0, 1.0],
                      'scale': [0.24, 0.24, 1.0],
                  },
                  'components': {
                      'sindri.grid_occupant': {'grid': 'floor', 'footprint': [[0, 0]]},
                      'sindri.script': {
                          'properties': {'step_seconds': 0.32},
                          'script': 'Wisp',
                          'source': 'scripts/wisp.decay',
                      },
                      'sindri.sprite': {
                          'layer': 15,
                          'space': 'world',
                          'texture': 'textures/orb.png',
                          'tint': [0.45, 0.82, 1.0, 0.72],
                      },
                  },
              })
          scene_path.write_text(json.dumps(scene, indent=2) + '\n')

          for doc in ['docs/scripting.md', 'docs/capabilities.md', 'CHANGELOG.md', 'docs/feature-integration-matrix.md']:
              p = Path(doc)
              if not p.exists():
                  continue
              text = p.read_text()
              if doc.endswith('scripting.md') and 'Grid.step_toward' not in text:
                  text += '''\n### Pathfinding\n\n`Grid.can_reach(mover, grid, target)` asks whether the mover's authored footprint has a route to the target's current cell. `Grid.step_toward(mover, grid, target)` performs one deterministic cardinal A* step and returns whether it moved. Both use `sindri.grid_navigation` walls and `sindri.grid_occupant` footprints from the scene; Decay receives typed entity references rather than raw navigation storage.\n'''
              if doc.endswith('capabilities.md') and 'Grid.step_toward' not in text:
                  text += '''\n### Scripted pathfinding\n\nDecay can query and advance authored grid occupants through deterministic A* with `Grid.can_reach` and `Grid.step_toward`. The host delegates to the same `WorldGridNavigation` adapter used by engine tests, so walls, occupancy, and whole footprints retain one meaning. Gather's Wisp exercises that path at runtime.\n'''
              if doc == 'CHANGELOG.md' and 'typed Decay pathfinding' not in text:
                  marker = '## [Unreleased]\n'
                  if marker in text:
                      text = text.replace(marker, marker + '\n- Add editor wall/footprint authoring, typed Decay pathfinding, and a Gather Wisp that proves authored A* navigation end to end.\n', 1)
              if doc.endswith('feature-integration-matrix.md'):
                  old = '| Pathfinding and occupancy | **Ready** — deterministic walls, A*, whole-footprint paths, authored components, and a validated world adapter | **Missing** | **Missing** | **Missing** | Add the editor adapter, then typed Decay access and a Gather use case |'
                  new = '| Pathfinding and occupancy | **Ready** — deterministic walls, A*, whole-footprint paths, authored components, and a validated world adapter | **Ready** — tilemap walls and occupant grid/footprint cells have dedicated inspector authoring | **Ready** — typed `can_reach` and `step_toward` calls delegate to the shared world adapter | **Ready** — the Wisp follows the player around authored walls through Decay | Per-path policies, costs, and richer viewport wall painting |'
                  text = text.replace(old, new)
                  text = text.replace('Add editor footprint, occupancy, and wall authoring', 'Add height-aware grid authoring and richer viewport navigation overlays')
              p.write_text(text)
          PY
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy,rustfmt
      - name: Install native audio dependency
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Canonicalize Gather scene
        env:
          SINDRI_UPDATE_GATHER_SCENE: '1'
        run: cargo test --package sindri-gather --test the_game_holds_together the_scene_file_is_canonical
      - name: Format and test changed surfaces
        run: |
          cargo fmt --all
          cargo test --package sindri-decay --package sindri-editor --package sindri-gather --all-features
          cargo clippy --workspace --all-targets --all-features
      - name: Commit implementation and remove helper
        if: github.event_name == 'push'
        run: |
          rm .github/workflows/pathfinding-dev.yml
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git add -A
          git commit -m 'Complete pathfinding vertical slice'
          git push origin HEAD:codex/pathfinding-vertical
